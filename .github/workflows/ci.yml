name: CI

# Les workflows réutilisables vivent dans kiln (antoine-tena/kiln, public), cités à la version
# de kiln dont part le projet (v0.3.0-rc.1) : `kiln update` les fait passer à la suivante. Le
# projet ne garde ici que ses paramètres.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@v0.3.0-rc.1
    with:
      dossier: backend

  frontend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@v0.3.0-rc.1
    with:
      dossier: frontend

  charte:
    uses: antoine-tena/kiln/.github/workflows/charte.yml@v0.3.0-rc.1

  securite:
    uses: antoine-tena/kiln/.github/workflows/securite.yml@v0.3.0-rc.1
    with:
      uv: "backend frontend"
      pnpm: ""

  conteneurs:
    uses: antoine-tena/kiln/.github/workflows/infra.yml@v0.3.0-rc.1
    with:
      containerfiles: "backend/Containerfile frontend/Containerfile"
      compose: compose.yaml
